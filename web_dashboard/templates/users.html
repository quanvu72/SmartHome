<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Smart Home Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            color: #333;
            font-size: 24px;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .users-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .users-table th,
        .users-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .users-table th {
            background: #f5f5f5;
            font-weight: 600;
            color: #333;
        }
        
        .users-table tr:hover {
            background: #f9f9f9;
        }
        
        .role-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .role-admin {
            background: #ffebee;
            color: #c62828;
        }
        
        .role-user {
            background: #e3f2fd;
            color: #1565c0;
        }
        
        .message {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #efe;
            color: #3c3;
        }
        
        .message.error {
            background: #fee;
            color: #c33;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Quản lý người dùng</h1>
            <div style="display: flex; gap: 10px;">
                <a href="/" class="btn btn-secondary">Quay lại Dashboard</a>
                <a href="/register" class="btn btn-primary">Thêm người dùng mới</a>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        <div class="users-card">
            <h2>Danh sách người dùng</h2>
            <table class="users-table" id="usersTable">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Vai trò</th>
                        <th>Ngày tạo</th>
                        <th>Cập nhật</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 20px;">
                            Đang tải...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // Load users on page load
        window.addEventListener('load', () => {
            loadUsers();
            loadCurrentUser();
        });
        
        let currentUser = null;
        
        async function loadCurrentUser() {
            try {
                const response = await fetch('/api/auth/users');
                const data = await response.json();
                
                if (data.success) {
                    // Lay thong tin user hien tai tu session
                    currentUser = data.current_user || null;
                }
            } catch (error) {
                console.error('Lỗi khi tải thông tin user:', error);
            }
        }
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/auth/users');
                const data = await response.json();
                
                if (data.success) {
                    displayUsers(data.users);
                } else {
                    showMessage('Lỗi khi tải danh sách người dùng', 'error');
                }
            } catch (error) {
                showMessage('Lỗi kết nối đến server', 'error');
            }
        }
        
        function displayUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            
            if (Object.keys(users).length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px;">Chưa có người dùng nào</td></tr>';
                return;
            }
            
            tbody.innerHTML = '';
            
            for (const [username, info] of Object.entries(users)) {
                const row = document.createElement('tr');
                
                const roleClass = info.role === 'admin' ? 'role-admin' : 'role-user';
                const roleText = info.role === 'admin' ? 'Admin' : 'User';
                
                // Chi hien nut xoa neu user hien tai la admin va khong phai la tai khoan admin mac dinh
                const isCurrentUserAdmin = currentUser && currentUser.role === 'admin';
                const canDelete = isCurrentUserAdmin && username !== 'admin';
                
                row.innerHTML = `
                    <td><strong>${username}</strong></td>
                    <td><span class="role-badge ${roleClass}">${roleText}</span></td>
                    <td>${info.created_at}</td>
                    <td>${info.updated_at || '-'}</td>
                    <td>
                        <div class="actions">
                            ${canDelete ? `
                                <button class="btn btn-danger btn-small" onclick="deleteUser('${username}')">
                                    Xoa
                                </button>
                            ` : '<span style="color: #999; font-size: 12px;">Khong the xoa</span>'}
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            }
        }
        
        async function deleteUser(username) {
            if (!confirm(`Bạn có chắc chắn muốn xóa người dùng "${username}"?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/auth/users/${username}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (response.status === 403) {
                    showMessage('Bạn không có quyền xóa người dùng (chỉ admin)', 'error');
                    return;
                }
                
                if (data.success) {
                    showMessage(`Đã xóa người dùng "${username}"`, 'success');
                    loadUsers(); // Reload table
                } else {
                    showMessage(data.error || 'Lỗi khi xóa người dùng', 'error');
                }
            } catch (error) {
                showMessage('Lỗi kết nối đến server', 'error');
            }
        }
        
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = 'message show ' + type;
            
            setTimeout(() => {
                message.classList.remove('show');
            }, 5000);
        }
    </script>
</body>
</html>
